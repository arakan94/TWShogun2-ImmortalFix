name: Release

# Push a tag such as v1.0.0 to build and publish a release:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/ShogunImmortal.Tests -c Release

      - name: Publish
        run: >
          dotnet publish ShogunImmortal.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          $zip = "ShogunImmortal-${{ github.ref_name }}-win-x64.zip"
          $files = @("publish/win-x64/*", "README.txt")
          if (Test-Path LICENSE) { $files += "LICENSE" }
          Compress-Archive -Path $files -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
